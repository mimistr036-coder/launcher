name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          /tmp/Godot_v4.3-stable_linux.x86_64 --version

      - name: Build cache (PCK)
        run: |
          python3 tools/build_cache.py
          python3 -m json.tool updates/www/version.json

      - name: Game autotest (offline city build)
        id: t1
        continue-on-error: true
        run: |
          set +e
          GAME_AUTOTEST=offline timeout 150 /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path game > /tmp/offline.log 2>&1
          echo $? > /tmp/offline.code
          echo "offline exit: $(cat /tmp/offline.code)"

      - name: Multiplayer autotest (server + client)
        id: t2
        if: always()
        continue-on-error: true
        run: |
          set +e
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path server -- --port=17777 > /tmp/server.log 2>&1 &
          SRV=$!
          sleep 4
          GAME_AUTOTEST=mp:127.0.0.1:17777 timeout 150 /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path game > /tmp/client.log 2>&1
          echo $? > /tmp/client.code
          kill $SRV 2>/dev/null
          echo "client exit: $(cat /tmp/client.code)"

      - name: Launcher E2E autotest (download + load cache)
        id: t3
        if: always()
        continue-on-error: true
        run: |
          set +e
          python3 tools/serve_updates.py 8090 > /tmp/http.log 2>&1 &
          HTTPD=$!
          sleep 2
          LAUNCHER_AUTOTEST=1 LAUNCHER_URL=http://127.0.0.1:8090 timeout 180 /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path launcher > /tmp/launcher.log 2>&1
          echo $? > /tmp/launcher.code
          kill $HTTPD 2>/dev/null
          echo "launcher exit: $(cat /tmp/launcher.code)"

      - name: Save logs into repo
        if: always()
        run: |
          set +e
          rm -rf ci-logs
          mkdir -p ci-logs
          for f in offline server client launcher http; do
            [ -f /tmp/$f.log ] && cp /tmp/$f.log ci-logs/$f.log
            [ -f /tmp/$f.code ] && cp /tmp/$f.code ci-logs/$f.code
          done
          git config user.name "arena-bot"
          git config user.email "actions@arena.local"
          git add ci-logs
          git add updates/www/game.pck updates/www/version.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: логи автотестов и кэш [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${{ github.ref_name }} > /dev/null 2>&1
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              sleep 5
            done
          fi

      - name: Gate
        if: always()
        run: |
          fail=0
          : > /tmp/gate.log
          for t in offline client launcher; do
            code=$(cat /tmp/$t.code 2>/dev/null || echo 99)
            echo "$t = '$code'" >> /tmp/gate.log
            if [ "$code" != "0" ]; then
              echo "STEP $t FAILED (exit $code)"
              fail=1
            else
              echo "STEP $t OK"
            fi
          done
          echo "gate fail=$fail" >> /tmp/gate.log
          mkdir -p ci-logs && cp /tmp/gate.log ci-logs/gate.log
          git config user.name "arena-bot"
          git config user.email "actions@arena.local"
          git add ci-logs/gate.log
          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} > /dev/null 2>&1
            if git push origin HEAD:${{ github.ref_name }}; then break; fi
            sleep 4
          done
          exit $fail

  compat40:
    # Проверка совместимости кэша с Godot 4.0 (как у пользователя на ПК).
    # Не блокирует Gate — информационная.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.0
        run: |
          curl -sL -o /tmp/g40.zip https://github.com/godotengine/godot/releases/download/4.0-stable/Godot_v4.0-stable_linux.x86_64.zip
          unzip -o /tmp/g40.zip -d /tmp
          chmod +x /tmp/Godot_v4.0-stable_linux.x86_64
          /tmp/Godot_v4.0-stable_linux.x86_64 --version

      - name: Build cache (PCK)
        run: python3 tools/build_cache.py

      - name: Launcher E2E on Godot 4.0
        continue-on-error: true
        run: |
          set +e
          python3 tools/serve_updates.py 8090 > /tmp/compat40-http.log 2>&1 &
          sleep 2
          LAUNCHER_AUTOTEST=1 LAUNCHER_URL=http://127.0.0.1:8090 timeout 180 /tmp/Godot_v4.0-stable_linux.x86_64 --headless --path launcher > /tmp/compat40.log 2>&1
          echo $? > /tmp/compat40.code
          echo "compat40 exit: $(cat /tmp/compat40.code)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-compat40
          path: /tmp/compat40.log

      - name: Commit log into repo
        if: always()
        run: |
          set +e
          mkdir -p ci-logs
          for f in compat40 compat40-http; do
            [ -f /tmp/$f.log ] && cp /tmp/$f.log ci-logs/$f.log
          done
          [ -f /tmp/compat40.code ] && echo "$(cat /tmp/compat40.code)" > ci-logs/compat40.code
          git config user.name "arena-bot"
          git config user.email "actions@arena.local"
          git add ci-logs
          if ! git diff --cached --quiet; then
            git commit -m "ci: логи совместимости с Godot 4.0 [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${{ github.ref_name }} > /dev/null 2>&1
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              sleep 5
            done
          fi

  apk:
    # Готовый APK лаунчера для Android + exe для Windows — без Godot у пользователя.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.3 + export templates
        run: |
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          curl -sL -o /tmp/tpl.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o /tmp/tpl.tpz 'templates/*' -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp /tmp/tpl/templates/android_debug.apk ~/.local/share/godot/export_templates/4.3.stable/
          cp /tmp/tpl/templates/windows_debug_x86_64.exe ~/.local/share/godot/export_templates/4.3.stable/
          cp /tmp/tpl/templates/windows_release_x86_64.exe ~/.local/share/godot/export_templates/4.3.stable/

      - name: Editor settings (SDK, JDK, debug-keystore)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p ~/.config/godot
          for name in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > ~/.config/godot/$name <<EOF
          [export]

          android/java_sdk_path="${JAVA_HOME}"
          android/android_sdk_path="/usr/local/lib/android/sdk"
          android/debug_keystore="${HOME}/.android/debug.keystore"
          android/debug_keystore_user="androiddebugkey"
          android/debug_keystore_pass="android"
          EOF
          done

      - name: Export Android APK + Windows exe
        run: |
          cd launcher
          mkdir -p builds
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --export-debug "Android" builds/provinciya-launcher.apk
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --export-debug "Windows" builds/provinciya-launcher.exe
          ls -la builds/

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: provinciya-launcher
          path: launcher/builds/*
          if-no-files-found: error
